<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 180" aria-hidden="true">
  <!-- Cap slightly detached -->
  <rect x="28" y="4" width="24" height="16" rx="4" fill="#1E6FD9" transform="rotate(-10,40,12)"/>
  <!-- Neck -->
  <rect x="30" y="20" width="20" height="10" rx="2" fill="#C8D8B0" stroke="#8A7A60" stroke-width="2"/>
  <!-- Body - dented/deformed -->
  <path d="M22 30 h36 l5 22 v85 a9 9 0 0 1-9 9 H26 a9 9 0 0 1-9-9 V52 z" fill="#C8D8B0" stroke="#8A7A60" stroke-width="2.5"/>
  <!-- Dent 1 -->
  <path d="M50 60 Q58 72 54 80 Q52 68 50 60z" fill="#8A7A60" opacity=".3"/>
  <!-- Dent 2 -->
  <path d="M24 90 Q18 98 22 106 Q26 96 24 90z" fill="#8A7A60" opacity=".3"/>
  <!-- Label half peeled -->
  <rect x="20" y="75" width="40" height="38" rx="3" fill="#8A7A60" opacity=".2"/>
  <path d="M44 75 L60 68 L60 92 L44 95 z" fill="#F4EBD9" opacity=".6"/>
  <!-- Water ripples -->
  <path d="M5 155 Q20 148 40 155 Q60 162 75 155" stroke="#F1D38A" stroke-width="2" fill="none" opacity=".7"/>
  <path d="M5 165 Q20 158 40 165 Q60 172 75 165" stroke="#F1D38A" stroke-width="2" fill="none" opacity=".5"/>
</svg>