<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="rivSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#554C3C"/>
      <stop offset="100%" stop-color="#80725C"/>
    </linearGradient>
    <linearGradient id="rivWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E4434"/>
      <stop offset="50%" stop-color="#5F523E"/>
      <stop offset="100%" stop-color="#73634C"/>
    </linearGradient>
    <linearGradient id="rivDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <rect width="600" height="150" fill="url(#rivSky)"/>

  <!-- Riverbanks with silt & foliage -->
  <path d="M0 130 Q140 110 300 135 T600 120 L600 200 L0 180 Z" fill="#3A3225" opacity="0.8"/>
  <circle cx="100" cy="115" r="28" fill="#2E3725" opacity="0.6"/>
  <circle cx="140" cy="120" r="32" fill="#3D452E" opacity="0.7"/>
  <circle cx="480" cy="110" r="35" fill="#2E3725" opacity="0.6"/>
  <circle cx="530" cy="118" r="30" fill="#3D452E" opacity="0.7"/>

  <!-- Murky Water Body -->
  <rect y="160" width="600" height="240" fill="url(#rivWater)"/>

  <!-- Turbid flow lines -->
  <path d="M0 190 Q150 175 300 192 T600 185" stroke="#9E896B" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M0 230 Q180 215 360 232 T600 225" stroke="#B8A281" stroke-width="2.2" fill="none" opacity="0.45"/>
  <path d="M0 280 Q120 265 280 282 T600 275" stroke="#CBB798" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 340 Q200 325 400 342 T600 335" stroke="#D8C8AF" stroke-width="2.5" fill="none" opacity="0.35"/>

  <!-- Floating plastic bottles & debris in river -->
  <g transform="translate(180, 225) rotate(-22)">
    <rect x="-8" y="-18" width="16" height="36" rx="4" fill="#B0BEC5" stroke="#455A64" stroke-width="1.2" opacity="0.8"/>
    <rect x="-4" y="-23" width="8" height="5" rx="1" fill="#1E6FD9"/>
  </g>
  <g transform="translate(260, 290) rotate(35)">
    <rect x="-9" y="-20" width="18" height="40" rx="4" fill="#CFD8DC" stroke="#546E7A" stroke-width="1.2" opacity="0.75"/>
    <rect x="-4.5" y="-25" width="9" height="5" rx="1" fill="#F1D38A"/>
  </g>
  <g transform="translate(420, 245) rotate(-65)">
    <rect x="-7" y="-16" width="14" height="32" rx="3" fill="#ECEFF1" stroke="#455A64" stroke-width="1.2" opacity="0.7"/>
    <rect x="-3" y="-20" width="6" height="4" rx="1" fill="#1E6FD9"/>
  </g>

  <!-- Vignette -->
  <rect width="600" height="400" fill="url(#rivDark)"/>
</svg>