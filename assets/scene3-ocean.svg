<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" aria-hidden="true">
  <!-- Ocean deep scene -->
  <!-- Deep water layers -->
  <rect width="320" height="200" fill="#0B3C49"/>
  <rect width="320" height="80" fill="#0D4555" opacity=".6"/>
  <rect width="320" height="40" fill="#0F4E61" opacity=".4"/>
  <!-- Light shafts from surface -->
  <path d="M100 0 L80 200" stroke="#6FD0E8" stroke-width="20" opacity=".04"/>
  <path d="M160 0 L150 200" stroke="#6FD0E8" stroke-width="15" opacity=".04"/>
  <path d="M220 0 L240 200" stroke="#6FD0E8" stroke-width="12" opacity=".03"/>
  <!-- Coral/seaweed bottom -->
  <path d="M0 180 Q20 165 30 180 Q40 165 50 180 Q60 165 70 180" stroke="#1F8A5B" stroke-width="4" fill="none" opacity=".5"/>
  <path d="M250 175 Q270 158 280 175 Q295 158 310 175" stroke="#1F8A5B" stroke-width="4" fill="none" opacity=".5"/>
  <!-- Rock/coral shapes -->
  <ellipse cx="40" cy="195" rx="35" ry="12" fill="#0A2F3A" opacity=".8"/>
  <ellipse cx="280" cy="195" rx="40" ry="12" fill="#0A2F3A" opacity=".8"/>
  <!-- Fish silhouettes -->
  <path d="M60 80 Q80 72 90 80 Q80 88 60 80 z M90 80 L100 76 L100 84 z" fill="#6FD0E8" opacity=".3"/>
  <path d="M230 120 Q248 114 256 120 Q248 126 230 120 z M256 120 L264 116 L264 124 z" fill="#6FD0E8" opacity=".25"/>
  <!-- Bubble trails -->
  <circle cx="145" cy="160" r="3" fill="none" stroke="#6FD0E8" stroke-width="1" opacity=".5"/>
  <circle cx="150" cy="140" r="2" fill="none" stroke="#6FD0E8" stroke-width="1" opacity=".45"/>
  <circle cx="143" cy="122" r="2.5" fill="none" stroke="#6FD0E8" stroke-width="1" opacity=".4"/>
  <!-- Bottle sinking, algae-covered -->
  <g transform="translate(150,110) rotate(-110)">
    <rect x="-6" y="-30" width="12" height="10" rx="2" fill="#2A6B5A"/>
    <path d="M-7 -20 h14 l3 10 v44 a5 5 0 0 1-5 5 h-10 a5 5 0 0 1-5-5 V-10 z" fill="#2A6B5A" stroke="#0B3C49" stroke-width="1.5"/>
    <circle cx="-2" cy="8" r="4" fill="#1A4A3A"/>
    <circle cx="6" cy="20" r="3" fill="#1A4A3A"/>
    <path d="M-5 -5 Q-14 -15 -12 -28" stroke="#1F8A5B" stroke-width="2" fill="none"/>
  </g>
</svg>