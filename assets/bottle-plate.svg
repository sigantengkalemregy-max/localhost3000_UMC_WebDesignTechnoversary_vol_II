<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" aria-hidden="true">
  <!-- Plate -->
  <ellipse cx="100" cy="130" rx="80" ry="22" fill="#2A3540" stroke="#3A4A54" stroke-width="2"/>
  <ellipse cx="100" cy="120" rx="78" ry="20" fill="#344552"/>
  <ellipse cx="100" cy="118" rx="62" ry="16" fill="#2E3E48"/>
  <!-- Food on plate (rice/noodles style) -->
  <ellipse cx="100" cy="116" rx="50" ry="12" fill="#4A5A64" opacity=".8"/>
  <!-- Microplastic particles floating/falling into plate -->
  <circle cx="60" cy="40" r="3" fill="#F1D38A" opacity=".9"/>
  <circle cx="80" cy="20" r="2" fill="#6FD0E8" opacity=".9"/>
  <circle cx="100" cy="10" r="2.5" fill="#F1D38A" opacity=".85"/>
  <circle cx="120" cy="30" r="2" fill="#6FD0E8" opacity=".9"/>
  <circle cx="140" cy="50" r="3" fill="#F1D38A" opacity=".85"/>
  <circle cx="70" cy="65" r="2" fill="#6FD0E8" opacity=".8"/>
  <circle cx="90" cy="75" r="2.5" fill="#F1D38A" opacity=".9"/>
  <circle cx="110" cy="60" r="2" fill="#6FD0E8" opacity=".85"/>
  <circle cx="130" cy="70" r="3" fill="#F1D38A" opacity=".8"/>
  <circle cx="150" cy="80" r="2" fill="#6FD0E8" opacity=".9"/>
  <!-- Particle trails -->
  <line x1="60" y1="43" x2="75" y2="110" stroke="#F1D38A" stroke-width="0.8" opacity=".3" stroke-dasharray="3,4"/>
  <line x1="100" y1="13" x2="100" y2="108" stroke="#6FD0E8" stroke-width="0.8" opacity=".3" stroke-dasharray="3,4"/>
  <line x1="140" y1="53" x2="120" y2="108" stroke="#F1D38A" stroke-width="0.8" opacity=".3" stroke-dasharray="3,4"/>
  <!-- Warning symbol -->
  <text x="98" y="122" font-family="sans-serif" font-size="12" fill="#F1D38A" text-anchor="middle" opacity=".8">⚠</text>
</svg>