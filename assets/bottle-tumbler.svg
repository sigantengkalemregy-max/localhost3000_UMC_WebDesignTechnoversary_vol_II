<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 180" aria-hidden="true">
  <!-- Tumbler/reusable bottle - green, sturdy -->
  <!-- Cap - robust twist cap -->
  <rect x="26" y="2" width="28" height="20" rx="6" fill="#1F8A5B"/>
  <rect x="29" y="6" width="22" height="12" rx="4" fill="#2BAF73"/>
  <!-- Handle -->
  <path d="M62 45 Q76 60 72 90 Q68 110 60 115" stroke="#1F8A5B" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Body - solid, no dents -->
  <path d="M24 22 h32 l4 18 v100 a10 10 0 0 1-10 10 H26 a10 10 0 0 1-10-10 V40 z" fill="#2BAF73" stroke="#1F8A5B" stroke-width="2.5"/>
  <!-- Body gradient overlay -->
  <path d="M24 22 h32 l4 18 v100 a10 10 0 0 1-10 10 H26 a10 10 0 0 1-10-10 V40 z" fill="url(#tg)" opacity=".3"/>
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- Brand/leaf icon on body -->
  <path d="M38 70 Q50 55 56 68 Q50 82 38 70z" fill="#1F8A5B"/>
  <path d="M38 70 Q44 62 50 68" stroke="white" stroke-width="1.5" fill="none" opacity=".7"/>
  <!-- Water fill indicator -->
  <path d="M18 120 Q28 116 40 120 Q52 124 60 120 v30 a10 10 0 0 1-10 10 H28 a10 10 0 0 1-10-10 z" fill="#1F8A5B" opacity=".35"/>
  <!-- Highlight -->
  <path d="M28 38 Q30 70 29 110" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity=".3"/>
  <!-- Stars/sparkle around it -->
  <path d="M8 50 L10 44 L12 50 L18 48 L12 52 L10 58 L8 52 L2 48 z" fill="#F1D38A" opacity=".8"/>
  <path d="M66 30 L68 24 L70 30 L76 28 L70 32 L68 38 L66 32 L60 28 z" fill="#F1D38A" opacity=".6"/>
</svg>